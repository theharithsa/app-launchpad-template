name: Feature request
description: A new or improved capability
title: "[Feature] "
type: Feature
labels: ["type: feature"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: Who needs this capability and what should they be able to do?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Scope and acceptance checks
      description: Describe observable success and how to verify it. Link a relevant parent or dependency when known.
    validations:
      required: true
