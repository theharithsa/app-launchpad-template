name: Task
description: Maintenance, research, documentation or infrastructure work
title: "[Task] "
type: Task
labels: ["type: task"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and affected component
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Completion check
      description: Record the result, test or decision that will establish completion.
    validations:
      required: true
  - type: textarea
    id: delivery
    attributes:
      label: Delivery impact and dependencies
      description: Link affected releases, risks or unresolved decisions as they become known.
