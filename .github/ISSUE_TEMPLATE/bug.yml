name: Bug report
description: Safe reproduction and expected behavior
title: "[Bug] "
type: Bug
labels: ["type: bug"]
body:
  - type: input
    id: affected
    attributes:
      label: Affected version and environment
      description: Give the release or commit and environment. Write unknown if they are still being identified.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Impact and safe reproduction
      description: Describe who is affected and the observed behavior using synthetic inputs. Report vulnerabilities through the private reporting route in SECURITY.md.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and regression check
      description: Describe the expected outcome and the check that would catch a recurrence.
    validations:
      required: true
  - type: textarea
    id: containment
    attributes:
      label: Production containment or recovery
      description: For a live regression, link the affected release and record the containment or rollback target.
