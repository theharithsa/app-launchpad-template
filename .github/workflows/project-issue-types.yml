name: Assign project issue types
on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: project-issue-type-assignment-${{ github.event.issue.number || 'repair' }}
  cancel-in-progress: false

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Classify missing issue types
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/github_intake.py types
