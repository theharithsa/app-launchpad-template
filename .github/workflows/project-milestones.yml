name: Assign project milestones
on:
  issues:
    types: [opened, reopened, closed, demilestoned]
  pull_request_target:
    types: [opened, reopened, closed, demilestoned]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: project-milestone-assignment-${{ github.event.issue.number || github.event.pull_request.number || 'repair' }}
  cancel-in-progress: false

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always run the default branch script. Never check out PR head code here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Assign missing intake milestones
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/github_intake.py milestones
